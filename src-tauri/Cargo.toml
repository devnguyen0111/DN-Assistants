[package]
name = "dn-assistant"
version = "0.1.0"
description = "DN Assistant desktop utilities"
authors = ["you"]
edition = "2021"

[lib]
name = "dn_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
nvml-wrapper = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
